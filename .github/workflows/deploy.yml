name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 63210
          script: |
            set -euo pipefail

            cd ${{ secrets.DEPLOY_PATH }}
            git checkout main
            git pull --ff-only origin main

            OLD_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' pgvector/pgvector:pg15 2>/dev/null || echo "none")

            docker compose pull postgres
            docker compose up -d postgres
            bash scripts/db/apply_schema.sh
            docker compose build --pull bot api trace ingest
            docker compose up -d --remove-orphans
            docker image prune -f

            NEW_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' pgvector/pgvector:pg15 2>/dev/null || echo "none")

            if [ "$OLD_DIGEST" != "$NEW_DIGEST" ]; then
              echo "PostgreSQL image updated, running REINDEX..."
              docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "REINDEX SCHEMA CONCURRENTLY news;" -c "REINDEX SCHEMA CONCURRENTLY public;"'
            else
              echo "PostgreSQL image unchanged, skipping REINDEX."
            fi

            echo "Checking container health..."
            for svc in postgres bot api trace ingest; do
              if ! docker compose ps "$svc" | grep -q "Up"; then
                echo "Service $svc is not healthy/up"
                docker compose ps "$svc"
                exit 1
              fi
            done
            echo "All core services are up."
