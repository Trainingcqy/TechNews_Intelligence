[search_news]
description = '''
Search the news database for stories about a specific subject: a company, product, person, technology or event. Reports on the same event are grouped into a story. For each story, the result gives the evidence id, title, publisher, date and summary of its lead report, the number of reports and publishers in the story, and the ids and titles of its other reports.'''
no_result_hint = 'You can widen the time window, use different English wording, or remove filters, and try again.'

[search_news.fields]
query = 'Search terms, which MUST be in English.'
days = 'Time window: the number of most recent days. Ignored when start_date is set.'
start_date = 'Start date of a past period, in YYYY-MM-DD format.'
end_date = 'End date of the period, inclusive. MUST be set together with start_date. When empty, the period ends today.'
topic = 'Topic. Set it ONLY when the question names a topic; when empty, all topics are covered.'
kind = 'Article type. When empty, all types are covered.'
publisher_kind = 'official for official releases only, media for media reports only. When empty, both are included.'
sort = 'relevance ranks by relevance to query. importance puts first the stories whose titles mention query and that several publishers reported, and relevance fills the remaining places. time ranks by publication time, newest first.'
limit = 'Number of stories to return.'

[browse_news]
description = '''
Browse the stories in the news database within a time window, without a specific subject. By default, stories are ranked by the number of publishers that reported them. Reports on the same event are grouped into a story. For each story, the result gives the evidence id, title, publisher, date and summary of its lead report, the number of reports and publishers in the story, and the ids and titles of its other reports.'''
no_result_hint = 'You can widen the time window or remove filters, and try again.'

[browse_news.fields]
days = 'Time window: the number of most recent days. Ignored when start_date is set.'
start_date = 'Start date of a past period, in YYYY-MM-DD format.'
end_date = 'End date of the period, inclusive. MUST be set together with start_date. When empty, the period ends today.'
topic = 'Topic to browse. Set it ONLY when the question names a topic; when empty, all topics are covered.'
kind = 'Article type. When empty, only news, release and research are covered.'
publisher_kind = 'official for official releases only, media for media reports only. When empty, both are included.'
sort = 'importance ranks by the number of publishers that reported the story. time ranks by the time of the latest report in the story, newest first.'
limit = 'Number of stories to return.'

[read_articles]
description = 'Read the full text of reports. Returns the title, publisher, date and text length of each report, followed by the text read; the text is also added to the evidence for the model that writes the answer.'

[read_articles.fields]
ids = 'Evidence ids from search results, such as E3.'
urls = "Links that appear in the user's messages. No other links are accepted."
max_chars = 'Maximum number of characters to read from each report.'

[read_history]
description = '''
Read the answers this user received before, both earlier in this conversation and in earlier conversations. Use it ONLY when the user asks how something an earlier answer covered has developed since. With keywords, returns the lines of the answers that mention them and the reports those lines cite, which are added to the evidence. Without keywords, lists the most recent answers.'''
no_result_hint = 'You can try other wording, call read_history without keywords to list the most recent answers, or search for the matter as an ordinary question.'

[read_history.fields]
keywords = 'The name of the matter the user asks about, in both its Chinese and English forms. An answer matches when its question or text contains any keyword, ignoring case. When empty, the most recent answers are listed.'
limit = 'Number of answers to return.'

[check_follows]
description = '''
Check the user's follows: search each follow for stories since it was last checked, ranked by the number of publishers, and return the stories grouped by follow. Use it ONLY when the user asks about the follows themselves.'''

[check_follows.fields]
queries = 'The English search terms of each follow. A follow left out is searched with its own words.'

[check_follows.query_fields]
follow = 'The follow, which MUST be copied exactly as written in <follows>.'
query = 'Search terms for the follow, which MUST be in English.'
