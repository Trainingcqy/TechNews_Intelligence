# Fixed project name: the containers and volumes (pg_data holds the production database) were created under this
# name while this file lived in deployment/; a different name would start an empty database.
name: deployment

x-agent-common-env: &agent-common-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-DB}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASS}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  VERTEX_PROJECT: ${VERTEX_PROJECT}
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
  JINA_API_KEY: ${JINA_API_KEY}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: tech_news_db
    restart: always
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: tech_news_bi
    restart: always
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_OPTS=-Xmx2048m -Xms1024m
    volumes:
      # 此处为挂载宿主机上已有的 Metabase DB 文件，位于 deployment/
      - ./deployment:/metabase-data
      # 注意：若无 Metabase DB 文件应采用下面的形式
      # - metabase_data:/metabase-data
    networks:
      - app_network

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-runtime
    container_name: tech_news_ingest
    restart: always
    command: [ "python", "-m", "ingest", "loop" ]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-DB}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JINA_API_KEY: ${JINA_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,postgres
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-runtime
    container_name: tech_news_bot
    restart: always
    command: [ "python", "-m", "app.bot" ]
    environment:
      <<: *agent-common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/run/secrets/gcp-sa.json:ro
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-runtime
    container_name: tech_news_api
    restart: always
    command: [ "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: *agent-common-env
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_BASE_URL: ${API_BASE_URL}
      APPROVE_LINK_SECRET: ${APPROVE_LINK_SECRET}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/run/secrets/gcp-sa.json:ro
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  trace:
    build:
      context: .
      dockerfile: Dockerfile
      target: trace-runtime
    container_name: tech_news_trace
    restart: always
    command: [ "uvicorn", "app.trace_api:app", "--host", "0.0.0.0", "--port", "8010" ]
    ports:
      - "127.0.0.1:${TRACE_DASHBOARD_PORT:-8010}:8010"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-DB}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      TRACE_DASHBOARD_TOKEN: ${TRACE_DASHBOARD_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  metabase_data:

networks:
  app_network:
    driver: bridge
