<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 796" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c9d1d9"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1000" height="796" fill="#0d1117"/>

  <!-- ===== ZONE TITLES ===== -->
  <g font-size="15" font-weight="700" fill="#f0f6fc">
    <text x="30"  y="36">来源</text>
    <text x="350" y="36">采集管线 ingest/　单进程循环，每 5 分钟一轮</text>
    <text x="30"  y="296">存储</text>
    <text x="30"  y="462">Agent　agent/</text>
    <text x="30"  y="694">入口</text>
  </g>

  <!-- ===== EDGES ===== -->
  <g stroke="#c9d1d9" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <!-- sources -> ingest -->
    <line x1="310" y1="140" x2="346" y2="140"/>
    <!-- ingest -> store -->
    <line x1="660" y1="232" x2="660" y2="304"/>
    <!-- store -> agent -->
    <line x1="500" y1="410" x2="500" y2="474"/>
    <!-- agent -> channels -->
    <line x1="500" y1="654" x2="500" y2="710"/>
  </g>
  <g font-size="12" fill="#c9d1d9" text-anchor="middle">
    <rect x="674" y="256" width="28" height="18" rx="4" fill="#0d1117"/>
    <text x="688" y="269">写</text>
    <rect x="514" y="432" width="28" height="18" rx="4" fill="#0d1117"/>
    <text x="528" y="445">读</text>
  </g>
  <text x="514" y="686" font-size="12" fill="#c9d1d9">Answer：状态、正文、来源列表；过程事件</text>

  <!-- ===== SOURCES ===== -->
  <g stroke="#c9d1d9" stroke-width="1.5" fill="#161b22">
    <rect x="30" y="50" width="280" height="180" rx="8"/>
  </g>
  <g font-size="14" fill="#f0f6fc">
    <text x="46" y="82">官方渠道 14　feed / 站点地图</text>
    <text x="46" y="112">英文媒体 10　feed</text>
    <text x="46" y="142">中文媒体 7　feed</text>
    <text x="46" y="172">HackerNews　API</text>
    <text x="46" y="202">Techmeme　feed，只作参照</text>
  </g>

  <!-- ===== INGEST ===== -->
  <g stroke="#c9d1d9" stroke-width="1.5" fill="#161b22">
    <rect x="350" y="50" width="620" height="180" rx="8"/>
  </g>
  <g stroke="#8b949e" stroke-width="1.2" fill="#0d1117">
    <rect x="360" y="70" width="90" height="70" rx="6"/>
    <rect x="462" y="70" width="90" height="70" rx="6"/>
    <rect x="564" y="70" width="90" height="70" rx="6"/>
    <rect x="666" y="70" width="90" height="70" rx="6"/>
    <rect x="768" y="70" width="90" height="70" rx="6"/>
    <rect x="870" y="70" width="90" height="70" rx="6"/>
  </g>
  <g stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arrowLight)">
    <line x1="451" y1="105" x2="460" y2="105"/>
    <line x1="553" y1="105" x2="562" y2="105"/>
    <line x1="655" y1="105" x2="664" y2="105"/>
    <line x1="757" y1="105" x2="766" y2="105"/>
    <line x1="859" y1="105" x2="868" y2="105"/>
  </g>
  <g font-size="14" fill="#f0f6fc" text-anchor="middle">
    <text x="405" y="98">discover</text>
    <text x="507" y="98">fetch</text>
    <text x="609" y="98">analyze</text>
    <text x="711" y="98">embed</text>
    <text x="813" y="98">link</text>
    <text x="915" y="98">discuss</text>
  </g>
  <g font-size="12" fill="#c9d1d9" text-anchor="middle">
    <text x="405" y="120">发现候选</text>
    <text x="507" y="120">取正文</text>
    <text x="609" y="120">摘要与分类</text>
    <text x="711" y="120">向量</text>
    <text x="813" y="120">故事归并</text>
    <text x="915" y="120">HN 讨论</text>
  </g>
  <g font-size="12" fill="#c9d1d9">
    <text x="364" y="168">状态：discovered → fetched → analyzed → embedded → ready；analyze、embed 重试用尽记为 failed</text>
    <text x="364" y="190">进程级 advisory lock；loop 每天北京时间 9 点后的第一轮执行 monitor</text>
    <text x="364" y="212">发布方 · 渠道 · 发现记录三层模型，来源定义在 sources.toml</text>
  </g>

  <!-- ===== STORE ===== -->
  <g stroke="#c9d1d9" stroke-width="1.5" fill="#161b22">
    <rect x="30" y="306" width="940" height="104" rx="8"/>
  </g>
  <g font-size="14" fill="#f0f6fc">
    <text x="46" y="332" font-weight="700">PostgreSQL + pgvector　schema: news</text>
  </g>
  <g font-size="13" fill="#c9d1d9">
    <text x="46" y="358">publisher　publisher_host　channel　sighting　article</text>
    <text x="46" y="380">article_body　article_embedding　story_member　discussion</text>
    <text x="46" y="402">channel_poll　stage_failure　reference_headline</text>
  </g>

  <!-- ===== AGENT ===== -->
  <g stroke="#c9d1d9" stroke-width="1.5" fill="#161b22">
    <rect x="30" y="476" width="940" height="178" rx="8"/>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="46" y1="520" x2="954" y2="520"/>
    <line x1="46" y1="564" x2="954" y2="564"/>
    <line x1="46" y1="608" x2="954" y2="608"/>
  </g>
  <g font-size="14" fill="#f0f6fc" font-weight="700">
    <text x="46" y="504">检索</text>
    <text x="46" y="548">工具</text>
    <text x="46" y="592">编排</text>
    <text x="46" y="636">记忆</text>
  </g>
  <g font-size="12" fill="#8b949e">
    <text x="104" y="504">retrieval/</text>
    <text x="104" y="548">tools/</text>
    <text x="104" y="592">graph/</text>
    <text x="104" y="628">context.py</text>
    <text x="104" y="645">memory.py</text>
  </g>
  <g font-size="14" fill="#f0f6fc">
    <text x="210" y="504">全文、向量、精确三路召回 → RRF 融合 → 重排 → 按故事归并 → 排序</text>
    <text x="210" y="548">search_news　read_articles → 证据登记表，编号 E1、E2……</text>
    <text x="210" y="592">prepare → gather ⇄ run_tool → collect → synthesize → finalize</text>
    <text x="210" y="628">线程上下文：最近 4 轮对话；历史来源重新登记为证据</text>
    <text x="210" y="645">关注表 user_follow；阅读记录 user_story_seen。只决定检索参数，不进入证据</text>
  </g>

  <!-- ===== CHANNELS ===== -->
  <g stroke="#c9d1d9" stroke-width="1.5" fill="#161b22">
    <rect x="30"  y="712" width="170" height="44" rx="8"/>
    <rect x="220" y="712" width="170" height="44" rx="8"/>
    <rect x="410" y="712" width="170" height="44" rx="8"/>
    <rect x="600" y="712" width="190" height="44" rx="8"/>
    <rect x="810" y="712" width="160" height="44" rx="8"/>
  </g>
  <g font-size="14" fill="#f0f6fc" text-anchor="middle">
    <text x="115" y="739">Web 与 SSE</text>
    <text x="305" y="739">Telegram</text>
    <text x="495" y="739">CLI</text>
    <text x="695" y="739">MCP stdio server</text>
    <text x="890" y="739">Trace Console</text>
  </g>
</svg>
