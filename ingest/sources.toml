# Official channels

[[channel]]
key = "openai_news"
name = "OpenAI News"
fetch_kind = "feed"
endpoint = "https://openai.com/news/rss.xml"
publisher = "OpenAI"
lang = "en"
config = { exclude_url = '/business/learn/' }

[[channel]]
key = "anthropic_news"
name = "Anthropic News"
fetch_kind = "sitemap"
endpoint = "https://www.anthropic.com/sitemap.xml"
publisher = "Anthropic"
lang = "en"
config = { url_pattern = "/news/" }

[[channel]]
key = "google_ai"
name = "Google AI Blog"
fetch_kind = "feed"
endpoint = "https://blog.google/technology/ai/rss/"
publisher = "Google"
lang = "en"

[[channel]]
key = "google_deepmind"
name = "Google DeepMind Blog"
fetch_kind = "feed"
endpoint = "https://deepmind.google/blog/rss.xml"
publisher = "Google"
lang = "en"

[[channel]]
key = "meta_newsroom"
name = "Meta Newsroom"
fetch_kind = "feed"
endpoint = "https://about.fb.com/news/feed/"
publisher = "Meta"
lang = "en"
config = { body_from_feed = true }

[[channel]]
key = "microsoft_blog"
name = "Official Microsoft Blog"
fetch_kind = "feed"
endpoint = "https://blogs.microsoft.com/?feed=rss2"
publisher = "Microsoft"
lang = "en"
config = { body_from_feed = true }

[[channel]]
key = "nvidia_newsroom"
name = "NVIDIA Newsroom"
fetch_kind = "feed"
endpoint = "https://nvidianews.nvidia.com/releases.xml"
publisher = "NVIDIA"
lang = "en"

[[channel]]
key = "apple_newsroom"
name = "Apple Newsroom"
fetch_kind = "feed"
endpoint = "https://www.apple.com/newsroom/rss-feed.rss"
publisher = "Apple"
lang = "en"

[[channel]]
key = "aws_news"
name = "AWS News Blog"
fetch_kind = "feed"
endpoint = "https://aws.amazon.com/blogs/aws/feed/"
publisher = "AWS"
lang = "en"
config = { body_from_feed = true }

[[channel]]
key = "deepseek_news"
name = "DeepSeek News"
fetch_kind = "sitemap"
endpoint = "https://api-docs.deepseek.com/sitemap.xml"
publisher = "DeepSeek"
lang = "en"
config = { url_pattern = "/news/", lastmod_optional = true }

[[channel]]
key = "mistral_news"
name = "Mistral AI News"
fetch_kind = "sitemap"
endpoint = "https://mistral.ai/sitemap-0.xml"
publisher = "Mistral AI"
lang = "en"
config = { url_pattern = "/news/", exclude_url = 'mistral\.ai/(fr|es|de|it|ja|ko|zh|pt)/|/news/$' }

[[channel]]
key = "amd_news"
name = "AMD Press Releases"
fetch_kind = "feed"
endpoint = "https://ir.amd.com/news-events/press-releases/rss"
publisher = "AMD"
lang = "en"

