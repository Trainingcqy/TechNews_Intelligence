# Official channels

[[channel]]
key = "openai_news"
name = "OpenAI News"
fetch_kind = "feed"
endpoint = "https://openai.com/news/rss.xml"
publisher = "OpenAI"
lang = "en"

[[channel]]
key = "anthropic_news"
name = "Anthropic News"
fetch_kind = "sitemap"
endpoint = "https://www.anthropic.com/sitemap.xml"
publisher = "Anthropic"
lang = "en"
config = { url_pattern = "/news/" }

[[channel]]
key = "google_ai"
name = "Google AI Blog"
fetch_kind = "feed"
endpoint = "https://blog.google/technology/ai/rss/"
publisher = "Google"
lang = "en"

[[channel]]
key = "google_deepmind"
name = "Google DeepMind Blog"
fetch_kind = "feed"
endpoint = "https://deepmind.google/blog/rss.xml"
publisher = "Google"
lang = "en"

[[channel]]
